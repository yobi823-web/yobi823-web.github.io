<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#245cda">
  <meta name="color-scheme" content="light">
  <meta name="description" content="民法総則を文章の黒塗りで覚えるタントー君。黒塗りをタップして答えを確認し、もう一度の問題を復習できます。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="タントー君">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./tanto.css?v=group1">
  <title>タントー君 — 民法総則の穴埋め学習</title>
  <script src="./tanto.js?v=group1" defer></script>
  <script src="./pwa.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="home-link" href="./">学習ツールのトップ</a>
      <div class="brand"><span class="brand-icon" aria-hidden="true">タ</span><div><h1>タントー君</h1><p>民法総則の穴埋め学習</p></div></div>
    </header>
    <main id="main">
      <div id="loading" class="message" role="status">教材を読み込んでいます。</div>
      <div id="loadError" class="message error" role="alert" hidden><p>教材を読み込めませんでした。通信を確認して再読み込みしてください。</p><button id="retryLoad" type="button" class="button primary">再読み込み</button></div>
      <div id="app" hidden>
        <section class="study-controls" aria-label="出題範囲">
          <div class="deck-line"><h2 id="deckTitle">民法総則 1</h2><span id="totalCount" class="total-count"></span></div>
          <div class="filters">
            <div class="field category-field"><label for="category">分野</label><select id="category"><option value="">すべての分野</option></select></div>
            <div class="field"><label for="filter">学習状況</label><select id="filter"><option value="all">すべて</option><option value="new">未学習</option><option value="again">もう一度</option><option value="known">覚えた</option></select></div>
            <button id="shuffle" type="button" class="button order-button" aria-pressed="false">順番どおり</button>
          </div>
          <p id="stats" class="stats" aria-live="polite"></p>
        </section>
        <section id="study" aria-label="穴埋め学習">
          <div class="progress-head"><span id="position"></span><span id="categoryLabel"></span></div>
          <progress id="progress" value="0" max="1" aria-label="この学習で確認した問題数"></progress>
          <article id="questionCard" class="question-card">
            <p id="clozeHint" class="cloze-hint">黒塗りをタップして答えを確認</p>
            <div id="question" tabindex="-1" role="group" aria-label="問題文"></div>
            <div class="reveal-row"><span id="clozeCount" class="cloze-count" role="status"></span><button id="reveal" type="button" class="button quiet" aria-controls="question">すべて表示</button></div>
            <div class="grade-actions"><button id="again" type="button" class="button again-button" disabled>もう一度</button><button id="known" type="button" class="button known-button" disabled>覚えた</button></div>
          </article>
          <nav class="question-nav" aria-label="問題の移動"><button id="previous" type="button" class="button quiet">前の問題</button><span id="currentStatus"></span><button id="next" type="button" class="button quiet">次の問題</button></nav>
        </section>
        <section id="empty" class="message empty" hidden><h2>該当する問題はありません</h2><p id="emptyMessage"></p><button id="showAll" type="button" class="button primary">すべての問題を表示</button></section>
        <section id="complete" class="message complete" hidden><div class="completion-mark" aria-hidden="true">✓</div><h2>この範囲を一周しました</h2><p id="completeStats"></p><div class="completion-actions"><button id="restart" type="button" class="button primary">もう一周する</button><button id="reviewAgain" type="button" class="button">もう一度の問題を復習</button></div></section>
        <details id="questionList" class="question-list"><summary>問題一覧 <span id="listCount"></span></summary><div id="list"></div></details>
        <details id="reviewNotes" class="review-notes"><summary>確認中の項目 <span id="reviewCount"></span></summary><p>内容が確定するまで、この部分は出題していません。</p><div id="reviewList"></div></details>
        <footer class="app-footer"><p id="saveStatus" role="status">学習記録と続きの位置は、この端末に保存されます。</p><p class="source">教材：短答対策＿総１</p><p id="pwaStatus" class="offline-status"></p></footer>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
