<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ノリ弁君</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f5}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="app" src="./noriben-base.html" title="ノリ弁君"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    if(!d||!w||!d.getElementById('preview'))return;
    const home=d.querySelector('a[href="./"]');if(home)home.target='_top';
    const notice=d.querySelector('#maskPane .notice');
    if(notice)notice.textContent='本文を指やマウスで選ぶと、その場所に「黒塗り／解除」が出ます。選んだ文字を確認して、そのまま操作できます。既存の黒塗りはクリックでも解除できます。';
    const style=d.createElement('style');
    style.textContent=`.masked{cursor:pointer}.masked:hover{outline:2px solid #c56872;outline-offset:1px}.selection-menu-v3{position:fixed;z-index:9999;display:flex;align-items:center;gap:7px;max-width:min(92vw,560px);padding:8px;background:#172436;color:#fff;border-radius:10px;box-shadow:0 10px 35px #0004;user-select:none;-webkit-user-select:none}.selection-menu-v3[hidden]{display:none!important}.selection-menu-v3 .sel-excerpt{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#dfe7ee;padding:0 4px}.selection-menu-v3 .btn{min-height:36px;padding:6px 11px;border-color:#526171}.selection-menu-v3 .btn.primary{border-color:#126b4c}.selection-menu-v3 .btn.danger{background:#fff;color:#ad3042}@media(max-width:760px){.selection-menu-v3{max-width:calc(100vw - 16px);gap:5px;padding:6px}.selection-menu-v3 .sel-excerpt{max-width:130px}.selection-menu-v3 .btn{min-height:38px;padding:6px 9px;font-size:13px}}`;
    d.head.append(style);
    const menu=d.createElement('div');menu.id='selectionMenuV3';menu.className='selection-menu-v3';menu.hidden=true;
    menu.innerHTML='<span class="sel-excerpt" id="selectionExcerptV3"></span><button class="btn primary" id="quickMaskV3" type="button">黒塗り</button><button class="btn danger" id="quickUnmaskV3" type="button" hidden>解除</button>';
    d.body.append(menu);
    const preview=d.getElementById('preview'),excerpt=d.getElementById('selectionExcerptV3'),quickMask=d.getElementById('quickMaskV3'),quickUnmask=d.getElementById('quickUnmaskV3');
    let selected=null,timer=null;
    const masks=()=>{try{return w.current()?.masks||[]}catch(e){return[]}};
    function hide(){menu.hidden=true;selected=null}
    function locate(){
      const sel=w.getSelection();
      if(!sel||!sel.rangeCount||sel.isCollapsed){hide();return}
      const r=sel.getRangeAt(0);
      if(!preview.contains(r.startContainer)||!preview.contains(r.endContainer)){hide();return}
      const before=d.createRange();before.selectNodeContents(preview);before.setEnd(r.startContainer,r.startOffset);
      let start=before.toString().length,end=start+r.toString().length;
      const body=w.current()?.body||'';
      while(start<end&&/\s/.test(body[start]))start++;
      while(end>start&&/\s/.test(body[end-1]))end--;
      if(start>=end){hide();return}
      selected={start,end};
      const txt=body.slice(start,end).replace(/\s+/g,' ');
      excerpt.textContent='「'+txt.slice(0,34)+(txt.length>34?'…':'')+'」';
      quickUnmask.hidden=!masks().some(m=>m.start<end&&m.end>start);
      menu.hidden=false;
      requestAnimationFrame(()=>{
        const rr=r.getBoundingClientRect(),mw=menu.offsetWidth,mh=menu.offsetHeight,margin=8;
        let left=Math.max(margin,Math.min(w.innerWidth-mw-margin,rr.left+(rr.width-mw)/2));
        let top=rr.bottom+8;if(top+mh>w.innerHeight-margin)top=Math.max(margin,rr.top-mh-8);
        menu.style.left=Math.round(left)+'px';menu.style.top=Math.round(top)+'px';
      });
    }
    function schedule(ms=80){clearTimeout(timer);timer=setTimeout(locate,ms)}
    preview.addEventListener('mouseup',()=>schedule(20));
    preview.addEventListener('touchend',()=>schedule(130));
    preview.addEventListener('keyup',()=>schedule(20));
    d.addEventListener('selectionchange',()=>{const sel=w.getSelection();if(sel&&sel.rangeCount&&preview.contains(sel.anchorNode))schedule(90)});
    [quickMask,quickUnmask].forEach(b=>b.addEventListener('pointerdown',e=>e.preventDefault()));
    quickMask.addEventListener('click',()=>{if(!selected)return;const {start,end}=selected;hide();w.addMask(start,end)});
    quickUnmask.addEventListener('click',()=>{if(!selected)return;const {start,end}=selected;hide();w.unmaskSelected(start,end)});
    function decorate(){preview.querySelectorAll('.masked').forEach((el,i)=>{el.dataset.maskIndex=String(i);el.tabIndex=0;el.title='クリックでこの黒塗りを解除'})}
    const ob=new MutationObserver(decorate);ob.observe(preview,{childList:true,subtree:true});decorate();
    function removeMask(el){const i=Number(el.dataset.maskIndex);const q=w.current();if(!q||!Number.isInteger(i)||i<0||i>=q.masks.length)return;q.masks.splice(i,1);hide();w.getSelection()?.removeAllRanges();w.renderPreview();w.renderList();w.scheduleSave();w.toast('黒塗りを解除しました')}
    preview.addEventListener('click',e=>{const el=e.target.closest('.masked');const sel=w.getSelection();if(el&&(!sel||sel.isCollapsed))removeMask(el)});
    preview.addEventListener('keydown',e=>{const el=e.target.closest('.masked');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();removeMask(el)}});
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
