<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ノリ弁君</title><style>:root{--ink:#172436;--muted:#607087;--line:#dbe2ec;--bg:#f3f6fb;--paper:#fff;--green:#14785d;--tint:#e9f7f1;--danger:#ae3042}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.6}button,input,textarea{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;font-size:22px}h1,h2,p{margin:0}.brand p,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #c8d2df;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger)}.wrap{max-width:1400px;margin:auto;padding:22px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}input,textarea{width:100%;border:1px solid #becbd9;border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:240px;resize:vertical;line-height:1.8}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.qlist{display:flex;flex-direction:column;gap:7px;max-height:60vh;overflow:auto}.qrow{width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;padding:10px;cursor:pointer}.qrow.active{background:var(--tint);border-color:var(--green)}.qrow strong{display:block}.qrow span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.preview{white-space:pre-wrap;min-height:220px;border:1px solid #c8d2df;border-radius:9px;padding:18px;line-height:1.9;user-select:text}.mask{background:#19322c;color:transparent;border-radius:3px;padding:1px 0}.mask.reveal{color:var(--ink);background:#d8efe6}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.bar input{flex:1;min-width:180px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--tint);border:1px solid #b9ddcf;border-radius:7px;padding:6px 8px;font-size:13px;display:flex;gap:6px;align-items:center}.chip button{border:0;background:transparent;cursor:pointer}.status{font-size:13px;color:var(--muted);margin-top:10px}.home{color:var(--green);font-weight:700;text-decoration:none}@media(max-width:760px){.wrap{display:block;padding:12px}.panel{margin-bottom:12px}.grid{grid-template-columns:1fr}.qlist{max-height:180px}.actions{width:100%}.actions .btn{flex:1}.top{padding:14px}.preview{padding:14px}.bar .btn{width:100%}}</style></head><body><header class="top"><div class="brand"><div class="mark">ノ</div><div><h1>ノリ弁君</h1><p>黒塗り教材をつくる</p></div></div><div class="actions"><a class="btn" href="./">← トップ</a><button class="btn" id="loadBtn">JSONを読み込む</button><input id="loadFile" type="file" accept=".json,application/json" hidden><button class="btn primary" id="exportBtn">JSONを書き出す</button></div></header><div class="wrap"><aside class="panel"><div class="field"><label>教材名</label><input id="deckTitle" placeholder="例：刑事訴訟法 論証集"></div><div class="qhead"><h2 style="font-size:18px">論証一覧</h2><button class="btn" id="addBtn">＋ 追加</button></div><div class="qlist" id="qList"></div><div class="status" id="saveStatus"></div></aside><main class="panel"><div class="qhead"><div><div class="muted" id="position"></div><h2 id="editorTitle">論証を編集</h2></div><div class="actions"><button class="btn" id="dupBtn">複製</button><button class="btn danger" id="deleteBtn">削除</button></div></div><div class="grid"><div class="field"><label>論証タイトル</label><input id="qTitle" placeholder="例：訴因変更の要否"></div><div class="field"><label>科目</label><input id="subject" placeholder="例：刑事訴訟法"></div></div><div class="field"><label>本文</label><textarea id="body" placeholder="論証本文を入力"></textarea></div><div class="bar"><button class="btn primary" id="maskSelection">選択箇所を黒塗り</button><input id="wordInput" placeholder="または隠したい語句を入力"><button class="btn" id="maskWord">語句を黒塗り</button><button class="btn" id="togglePreview">答え表示を切替</button></div><p class="muted">下のプレビューで語句を選択して「選択箇所を黒塗り」。本文を変更すると、この論証の黒塗りは一度解除されます。</p><div id="preview" class="preview"></div><div class="chips" id="maskList"></div></main></div><script>'use strict';const $=id=>document.getElementById(id);const KEY='noriben-kun:draft:v1';const uid=()=>crypto.randomUUID?.()||'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);const stamp=()=>new Date().toISOString();let state={id:uid(),title:'',createdAt:stamp(),updatedAt:stamp(),questions:[newQ()]},active=0,reveal=false;function newQ(){return{id:uid(),title:'',subject:'',body:'',masks:[]}}function save(){state.title=$('deckTitle').value;state.updatedAt=stamp();localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='この端末に下書きを自動保存済み'}function loadDraft(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.format==='ankikun'||x?.questions){state={id:x.id||uid(),title:x.title||'',createdAt:x.createdAt||stamp(),updatedAt:x.updatedAt||stamp(),questions:Array.isArray(x.questions)&&x.questions.length?x.questions:[newQ()]}}catch(e){}}function q(){return state.questions[active]}function normalizeMasks(masks,body){return(masks||[]).map(m=>({start:+m.start,end:+m.end,text:body.slice(+m.start,+m.end)})).filter(m=>Number.isInteger(m.start)&&Number.isInteger(m.end)&&m.start>=0&&m.end>m.start&&m.end<=body.length).sort((a,b)=>a.start-b.start)}function renderList(){const box=$('qList');box.replaceChildren();state.questions.forEach((x,i)=>{const b=document.createElement('button');b.className='qrow'+(i===active?' active':'');b.innerHTML='<strong>'+(x.title||'無題の論証')+'</strong><span>'+(x.subject||'未分類')+' · 黒塗り '+(x.masks?.length||0)+'か所</span>';b.onclick=()=>{sync();active=i;render()};box.append(b)})}function renderPreview(){const x=q(),p=$('preview');p.replaceChildren();let pos=0;for(const m of normalizeMasks(x.masks,x.body)){p.append(document.createTextNode(x.body.slice(pos,m.start)));const s=document.createElement('span');s.className='mask'+(reveal?' reveal':'');s.textContent=x.body.slice(m.start,m.end);p.append(s);pos=m.end}p.append(document.createTextNode(x.body.slice(pos)));const ml=$('maskList');ml.replaceChildren();normalizeMasks(x.masks,x.body).forEach((m,i)=>{const c=document.createElement('span');c.className='chip';const t=document.createElement('span');t.textContent=x.body.slice(m.start,m.end);const b=document.createElement('button');b.textContent='×';b.onclick=()=>{x.masks.splice(i,1);renderPreview();renderList();save()};c.append(t,b);ml.append(c)})}function render(){const x=q();$('deckTitle').value=state.title||'';$('qTitle').value=x.title||'';$('subject').value=x.subject||'';$('body').value=x.body||'';$('position').textContent='論証 '+(active+1)+' / '+state.questions.length;renderList();renderPreview();save()}function sync(){const x=q();x.title=$('qTitle').value;x.subject=$('subject').value;const nb=$('body').value;if(nb!==x.body){x.body=nb;x.masks=[]}save()}function addMask(start,end){sync();const x=q();if(start<0||end<=start||end>x.body.length)return alert('黒塗りにする範囲を選んでください。');if(x.masks.some(m=>start<m.end&&end>m.start))return alert('既存の黒塗りと重なっています。');x.masks.push({start,end,text:x.body.slice(start,end)});x.masks.sort((a,b)=>a.start-b.start);renderPreview();renderList();save()}$('body').oninput=()=>{const x=q();if($('body').value!==x.body){x.body=$('body').value;x.masks=[];renderPreview();renderList();save()}};$('qTitle').oninput=()=>{q().title=$('qTitle').value;renderList();save()};$('subject').oninput=()=>{q().subject=$('subject').value;renderList();save()};$('deckTitle').oninput=save;$('addBtn').onclick=()=>{sync();state.questions.push(newQ());active=state.questions.length-1;render()};$('dupBtn').onclick=()=>{sync();const x=q();state.questions.splice(active+1,0,{...structuredClone(x),id:uid(),title:(x.title||'無題')+'（コピー）'});active++;render()};$('deleteBtn').onclick=()=>{if(state.questions.length===1){state.questions=[newQ()];active=0}else{state.questions.splice(active,1);active=Math.min(active,state.questions.length-1)}render()};$('maskSelection').onclick=()=>{sync();const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return alert('下のプレビューで隠したい箇所を選択してください。');const r=sel.getRangeAt(0);if(!$('preview').contains(r.commonAncestorContainer))return alert('下のプレビュー内を選択してください。');const pre=r.cloneRange();pre.selectNodeContents($('preview'));pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length,end=start+r.toString().length;sel.removeAllRanges();addMask(start,end)};$('maskWord').onclick=()=>{sync();const w=$('wordInput').value;if(!w)return;const x=q();const candidates=[];let pos=0;while((pos=x.body.indexOf(w,pos))!==-1){if(!x.masks.some(m=>pos<m.end&&pos+w.length>m.start))candidates.push(pos);pos+=Math.max(1,w.length)}if(!candidates.length)return alert('本文内に未指定の語句が見つかりません。');addMask(candidates[0],candidates[0]+w.length);$('wordInput').value=''};$('togglePreview').onclick=()=>{reveal=!reveal;renderPreview()};$('exportBtn').onclick=()=>{sync();if(!state.title.trim())return alert('教材名を入力してください。');if(state.questions.some(x=>!x.title.trim()||!x.body.trim()))return alert('すべての論証にタイトルと本文を入力してください。');const out={format:'ankikun',version:1,id:state.id,title:state.title,createdAt:state.createdAt,updatedAt:stamp(),questions:state.questions.map(x=>({...x,masks:normalizeMasks(x.masks,x.body)}))};const blob=new Blob([JSON.stringify(out,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(state.title||'教材').replace(/[\\/:*?"<>|]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};$('loadBtn').onclick=()=>$('loadFile').click();$('loadFile').onchange=async e=>{try{const raw=JSON.parse((await e.target.files[0].text()).replace(/^\uFEFF/,''));if(raw.format!=='ankikun'||raw.version!==1||!Array.isArray(raw.questions))throw 0;state={id:raw.id||uid(),title:raw.title||'',createdAt:raw.createdAt||stamp(),updatedAt:raw.updatedAt||stamp(),questions:raw.questions.map(x=>({id:x.id||uid(),title:x.title||'',subject:x.subject||'',body:x.body||'',masks:normalizeMasks(x.masks,x.body||'')}))};active=0;render()}catch(err){alert('アンキー君形式のJSONを読み込めません。')}finally{e.target.value=''}};loadDraft();render();</script></body></html>
