<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ノリ弁君</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f5}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="app" src="./noriben-base.html" title="ノリ弁君"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    if(!d||!w||!d.getElementById('preview'))return;
    const $=id=>d.getElementById(id);
    const preview=$('preview');
    const home=d.querySelector('a[href="./"]');if(home)home.target='_top';
    const notice=d.querySelector('#maskPane .notice');
    if(notice)notice.innerHTML='<b>✏️ ペン：</b>隠したい文字を指でなぞるだけ。指を離すと黒塗りになります。<b>↕ スクロール：</b>本文を上下に動かします。黒塗り済み部分はタップで解除できます。';

    const style=d.createElement('style');
    style.textContent=`
      #preview.paint-mode{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;touch-action:none;cursor:crosshair}
      #preview.scroll-mode{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;touch-action:pan-y;cursor:default}
      #preview .paint-char{border-radius:2px}
      #preview .paint-char.paint-pending{background:#a9dfc8;color:#10251e;box-shadow:inset 0 -2px 0 #126b4c}
      #preview .masked{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
      #preview .masked:active{outline:3px solid #d36a78;outline-offset:1px}
      .paint-switch{display:inline-flex;border:1px solid #b8c7d3;border-radius:9px;overflow:hidden;background:#fff}
      .paint-switch button{border:0;border-right:1px solid #d4dde5;background:#fff;padding:8px 11px;min-height:40px;font-weight:750;color:#334154}
      .paint-switch button:last-child{border-right:0}
      .paint-switch button.active{background:#126b4c;color:#fff}
      .paint-help{font-size:12px;color:#5d6b7e;margin-left:2px}
      @media(max-width:760px){.paint-switch{width:100%}.paint-switch button{flex:1}.paint-help{width:100%;margin-top:2px}.toolbar .legacy-selection-v4{display:none!important}}
    `;
    d.head.append(style);

    const oldMask=$('maskSelection'),oldUnmask=$('unmaskSelection');
    if(oldMask)oldMask.classList.add('legacy-selection-v4');
    if(oldUnmask)oldUnmask.classList.add('legacy-selection-v4');

    const toolbar=d.querySelector('#maskPane .toolbar');
    const sw=d.createElement('div');sw.className='paint-switch';
    sw.innerHTML='<button type="button" id="paintModeV4" class="active">✏️ 黒塗りペン</button><button type="button" id="scrollModeV4">↕ スクロール</button>';
    const help=d.createElement('span');help.className='paint-help';help.id='paintHelpV4';help.textContent='指でなぞると黒塗り';
    toolbar.prepend(help);toolbar.prepend(sw);
    const paintBtn=$('paintModeV4'),scrollBtn=$('scrollModeV4');

    let mode='paint',drawing=false,pointerId=null,anchor=-1,focus=-1;
    let charSpans=[];
    const originalRender=w.renderPreview;

    function setMode(next){
      mode=next;
      drawing=false;anchor=focus=-1;clearPending();
      preview.classList.toggle('paint-mode',mode==='paint');
      preview.classList.toggle('scroll-mode',mode==='scroll');
      paintBtn.classList.toggle('active',mode==='paint');
      scrollBtn.classList.toggle('active',mode==='scroll');
      help.textContent=mode==='paint'?'指でなぞると黒塗り':'上下にスワイプして移動';
    }
    paintBtn.onclick=()=>setMode('paint');
    scrollBtn.onclick=()=>setMode('scroll');

    function decoratePreview(){
      const q=w.current?.(); if(!q)return;
      let pos=0; const nodes=[...preview.childNodes]; charSpans=[];
      for(const node of nodes){
        if(node.nodeType===3){
          const text=node.nodeValue||'',frag=d.createDocumentFragment();
          for(let k=0;k<text.length;k++){
            const s=d.createElement('span');s.className='paint-char';s.textContent=text[k];s.dataset.i=String(pos+k);frag.appendChild(s);charSpans.push(s);
          }
          pos+=text.length;node.replaceWith(frag);
        }else if(node.nodeType===1 && node.classList.contains('masked')){
          const len=node.textContent.length;
          node.dataset.start=String(pos);node.dataset.end=String(pos+len);node.title='タップでこの黒塗りを解除';pos+=len;
        }else{
          pos+=(node.textContent||'').length;
        }
      }
      charSpans=[...preview.querySelectorAll('.paint-char')];
      setMode(mode);
    }
    w.renderPreview=function(){originalRender();decoratePreview()};
    decoratePreview();

    function clearPending(){for(const s of charSpans)s.classList.remove('paint-pending')}
    function showPending(){
      clearPending(); if(anchor<0||focus<0)return;
      const lo=Math.min(anchor,focus),hi=Math.max(anchor,focus);
      for(const s of charSpans){const i=Number(s.dataset.i);if(i>=lo&&i<=hi)s.classList.add('paint-pending')}
    }
    function charAtPoint(x,y){
      const el=d.elementFromPoint(x,y);
      if(!el)return null;
      return el.closest?.('#preview .paint-char')||null;
    }
    function removeMaskBySpan(el){
      const q=w.current?.();if(!q)return;
      const start=Number(el.dataset.start),end=Number(el.dataset.end);
      const i=q.masks.findIndex(m=>m.start===start&&m.end===end);
      if(i<0)return;
      q.masks.splice(i,1);w.renderPreview();w.renderList();w.scheduleSave();w.toast('黒塗りを解除しました');
    }

    preview.addEventListener('pointerdown',e=>{
      const masked=e.target.closest?.('.masked');
      if(masked)return;
      if(mode!=='paint')return;
      const ch=e.target.closest?.('.paint-char');if(!ch)return;
      e.preventDefault();
      drawing=true;pointerId=e.pointerId;anchor=focus=Number(ch.dataset.i);
      try{preview.setPointerCapture(e.pointerId)}catch(_){ }
      showPending();
    },{passive:false});

    preview.addEventListener('pointermove',e=>{
      if(!drawing||e.pointerId!==pointerId||mode!=='paint')return;
      e.preventDefault();
      const ch=charAtPoint(e.clientX,e.clientY);if(!ch)return;
      const i=Number(ch.dataset.i);if(i!==focus){focus=i;showPending()}
    },{passive:false});

    function finishPaint(e){
      if(!drawing||e.pointerId!==pointerId)return;
      e.preventDefault();drawing=false;
      try{preview.releasePointerCapture(e.pointerId)}catch(_){ }
      if(anchor>=0&&focus>=0){
        let start=Math.min(anchor,focus),end=Math.max(anchor,focus)+1;
        const body=w.current?.().body||'';
        while(start<end&&/\s/.test(body[start]))start++;
        while(end>start&&/\s/.test(body[end-1]))end--;
        clearPending();anchor=focus=-1;
        if(start<end)w.addMask(start,end);
      }
    }
    preview.addEventListener('pointerup',finishPaint,{passive:false});
    preview.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId){drawing=false;clearPending();anchor=focus=-1}}, {passive:true});

    preview.addEventListener('click',e=>{
      const m=e.target.closest?.('.masked');if(!m)return;
      e.preventDefault();e.stopPropagation();removeMaskBySpan(m);
    },true);

    preview.addEventListener('selectstart',e=>e.preventDefault());
    preview.addEventListener('contextmenu',e=>{if(mode==='paint')e.preventDefault()});
    setMode('paint');
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
