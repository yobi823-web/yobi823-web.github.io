t:240px;padding:22px}.hero{margin-bottom:26px}.hero h1{font-size:36px}}</style></head><body><main class="shell"><section class="hero"><div class="eyebrow">LAW STUDY TOOLS</div><h1>論証学習ツール</h1><p>教材を作るときはノリ弁君、覚えるときはアンキー君。どちらもブラウザー上で使えます。</p></section><section class="cards"><a class="card anki" href="./anki.html"><div class="icon">ア</div><h2>アンキー君</h2><p>ノリ弁君で作ったJSONを読み込み、黒塗りを一つずつ開きながら論証を暗記します。学習記録も端末内に保存します。</p><div class="go">アンキー君を開く →</div></a><a class="card noriben" href="./noriben.html"><div class="icon">ノ</div><h2>ノリ弁君</h2><p>論証本文の隠したい箇所を黒塗り指定し、アンキー君で使える教材JSONを作成します。</p><div class="go">ノリ弁君を開く →</div></a></section><div class="note">データは基本的にこのブラウザー内で処理されます。</div></main></body></html>
