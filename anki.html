<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アンキー君</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fb}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="app" src="./anki-app.html" title="アンキー君"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const actions=d.querySelector('.topactions');
    if(actions && !d.getElementById('homeBtn')){
      const home=d.createElement('a');
      home.id='homeBtn';
      home.className='btn';
      home.href='./';
      home.textContent='← トップ';
      actions.prepend(home);
    }
    const backup=d.getElementById('backupBtn');
    if(backup){
      backup.textContent='バックアップJSONを保存';
      backup.title='読み込んだ教材と、各論証の「覚えた／間違えた」学習記録をJSONで保存します。普段はブラウザーに自動保存されるため、端末移行やデータ消失対策用です。';
    }
    const help=d.querySelector('.helpbox p');
    if(help){
      help.textContent='読み込んだ教材と学習記録は、このブラウザーに自動保存されます。「バックアップJSONを保存」は端末移行やデータ消失対策用です。';
    }
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
