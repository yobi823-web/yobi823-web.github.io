<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ノリ弁君</title>
<style>
:root{--ink:#172436;--muted:#5d6b7e;--line:#d9e1ea;--bg:#f3f6f5;--paper:#fff;--accent:#126b4c;--tint:#e6f3ec;--danger:#ad3042}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:11px}.mark{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}.brand h1{margin:0;font-size:23px}.brand p{margin:0;color:var(--muted);font-size:13px}.actions,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #c7d2df;background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;min-height:42px;font-weight:700}.btn:hover:not(:disabled){background:#f2f5f8}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.wrap{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}.field{margin-bottom:14px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid #becbd9;border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}textarea{min-height:260px;resize:vertical;line-height:1.8}.muted{font-size:13px;color:var(--muted)}.status{font-size:13px;color:var(--muted);min-height:20px}.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.qhead h2{margin:0;font-size:18px}.qlist{display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 285px);min-height:360px;overflow:auto;padding-right:3px}.qrow{border:1px solid transparent;background:transparent;border-radius:8px;padding:10px;text-align:left;width:100%;color:var(--ink);min-height:62px}.qrow:hover{background:#f0f4f2}.qrow.active{background:var(--tint);border-color:var(--accent)}.qrow strong{display:block;overflow-wrap:anywhere;line-height:1.45}.qrow span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.tabs{display:flex;gap:8px;margin:14px 0;border-bottom:1px solid var(--line);padding-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:700}.tab.active{background:var(--tint);border-color:var(--accent);color:var(--accent)}.mask-pane[hidden],.text-pane[hidden]{display:none}.preview{white-space:pre-wrap;overflow-wrap:anywhere;min-height:220px;border:1px solid #c8d2df;border-radius:9px;padding:18px;line-height:1.9;user-select:text;-webkit-user-select:text;background:#fff}.masked{background:#17322b;color:transparent;border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}.show-answer .masked{background:#d8efe6;color:var(--ink)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{flex:1;min-width:150px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{display:flex;align-items:center;gap:7px;background:var(--tint);border:1px solid #b6d9ca;border-radius:7px;padding:6px 8px;font-size:13px;max-width:100%}.chip span{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip button{border:0;background:transparent;cursor:pointer;font-size:18px;color:#365d50}.notice{margin:10px 0;padding:9px 11px;background:#fff6df;color:#715110;border-radius:8px;font-size:13px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172436;color:#fff;padding:11px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 30px)}.toast.error{background:#9f2839}[hidden]{display:none!important}@media(min-width:761px){.wrap>aside.panel{position:sticky;top:14px;align-self:start}}@media(max-width:760px){.wrap{display:block;padding:12px}.panel{margin-bottom:12px}.grid{grid-template-columns:1fr}.qlist{max-height:42vh;min-height:260px}.actions{width:100%}.actions .btn,.actions a.btn{flex:1}.top{padding:13px}.toolbar .btn{width:100%}.preview{padding:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark">の</div><div><h1>ノリ弁君</h1><p>論証の黒塗りデータをつくる</p></div></div>
  <div class="actions">
    <a class="btn" href="./">← トップ</a>
    <button class="btn" id="importBtn">JSONを読み込む</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <button class="btn primary" id="exportBtn">JSONを書き出す</button>
  </div>
</header>
<div class="wrap">
<aside class="panel">
  <div class="field"><label for="deckTitle">教材名</label><input id="deckTitle" placeholder="例：刑事訴訟法・論証集"></div>
  <div class="status" id="saveStatus">入力すると下書きを自動保存</div>
  <div class="qhead" style="margin-top:14px"><h2>論証一覧</h2><button class="btn" id="addQuestion">＋ 追加</button></div>
  <div class="qlist" id="questionList"></div>
</aside>
<main class="panel">
  <div class="qhead"><div><div class="muted" id="position"></div><h2 style="margin:2px 0 0;font-size:21px">論証を編集</h2></div><div class="actions"><button class="btn" id="duplicateBtn">複製</button><button class="btn danger" id="deleteBtn">削除</button></div></div>
  <div class="grid"><div class="field"><label for="questionTitle">タイトル</label><input id="questionTitle" placeholder="論証のタイトル"></div><div class="field"><label for="subject">科目</label><input id="subject" placeholder="例：刑事訴訟法"></div></div>
  <div class="tabs"><button id="textTab" class="tab active">1 本文を編集</button><button id="maskTab" class="tab">2 黒塗りを指定</button></div>
  <section id="textPane" class="text-pane"><div class="field"><label for="body">本文</label><textarea id="body" placeholder="論証本文を入力・貼り付け"></textarea></div><div class="row"><span class="muted" id="bodyCount">0文字</span><button class="btn primary" id="goMask">黒塗りを指定する</button></div></section>
  <section id="maskPane" class="mask-pane" hidden>
    <div class="notice">下の本文をドラッグ選択して黒塗りを追加できます。すでに黒塗りされている範囲を選択すれば、その選択部分だけ解除できます。</div>
    <div class="toolbar"><button class="btn primary" id="maskSelection" disabled>選択箇所を黒塗り</button><button class="btn danger" id="unmaskSelection" disabled>選択箇所の黒塗り解除</button><button class="btn" id="toggleAnswers">答え表示を切替</button></div>
    <div id="preview" class="preview"></div>
    <div class="toolbar"><input id="findText" placeholder="隠したい語句"><select id="occurrence"><option value="">語句を入力</option></select><button class="btn" id="maskWord" disabled>この箇所を黒塗り</button></div>
    <div class="row"><span class="muted" id="maskCount">0か所</span><button class="btn danger" id="clearMasks">すべて解除</button></div>
    <div class="chips" id="maskList"></div>
  </section>
</main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='noriben-kun:draft:v2';
const now=()=>new Date().toISOString();
function uid(){try{if(globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function')return globalThis.crypto.randomUUID()}catch(e){}return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function newQuestion(){return{id:uid(),title:'',subject:'',body:'',masks:[]}}
function newDeck(){return{format:'ankikun',version:1,id:uid(),title:'',createdAt:now(),updatedAt:now(),questions:[newQuestion()]}}
let state=newDeck(),active=0,showAnswers=false,pendingSelection=null,found=[];
let saveTimer=null;
function toast(text,error=false){const t=$('toast');t.textContent=text;t.className='toast'+(error?' error':'');t.hidden=false;clearTimeout(t._timer);t._timer=setTimeout(()=>t.hidden=true,3500)}
function saveNow(){try{state.updatedAt=now();localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='この端末に下書き保存済み'}catch(e){$('saveStatus').textContent='このブラウザーには保存できません'}}
function scheduleSave(){$('saveStatus').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,180)}
function current(){return state.questions[active]}
function normalizeMasks(q){q.masks=(q.masks||[]).map(m=>({start:Number(m.start),end:Number(m.end),text:q.body.slice(Number(m.start),Number(m.end))})).filter(m=>Number.isInteger(m.start)&&Number.isInteger(m.end)&&m.start>=0&&m.end>m.start&&m.end<=q.body.length).sort((a,b)=>a.start-b.start);let end=-1;q.masks=q.masks.filter(m=>{if(m.start<end)return false;end=m.end;return true})}
function restore(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.format==='ankikun'&&raw.version===1&&Array.isArray(raw.questions)&&raw.questions.length){state=raw;state.questions.forEach(q=>{q.id=q.id||uid();q.title=q.title||'';q.subject=q.subject||'';q.body=q.body||'';normalizeMasks(q)})}}catch(e){}}
function renderList(){const box=$('questionList');box.replaceChildren();state.questions.forEach((q,i)=>{const b=document.createElement('button');b.className='qrow'+(i===active?' active':'');const title=document.createElement('strong');title.textContent=q.title||'タイトル未入力';const meta=document.createElement('span');meta.textContent=(q.subject||'科目未設定')+' · 黒塗り '+q.masks.length+'か所';b.append(title,meta);b.onclick=()=>{active=i;pendingSelection=null;renderAll();scheduleSave()};box.append(b)});$('exportBtn').textContent=state.questions.length+'件をJSONで書き出す'}
function renderPreview(){const q=current(),p=$('preview');p.replaceChildren();normalizeMasks(q);let pos=0;for(const m of q.masks){p.append(document.createTextNode(q.body.slice(pos,m.start)));const s=document.createElement('span');s.className='masked';s.textContent=q.body.slice(m.start,m.end);p.append(s);pos=m.end}p.append(document.createTextNode(q.body.slice(pos)));p.classList.toggle('show-answer',showAnswers);$('maskCount').textContent=q.masks.length+'か所';const ml=$('maskList');ml.replaceChildren();q.masks.forEach((m,i)=>{const c=document.createElement('div');c.className='chip';const s=document.createElement('span');s.textContent=q.body.slice(m.start,m.end);const x=document.createElement('button');x.type='button';x.textContent='×';x.onclick=()=>{q.masks.splice(i,1);renderPreview();renderList();scheduleSave()};c.append(s,x);ml.append(c)});renderFind();$('maskSelection').disabled=!pendingSelection;const ps=pendingSelection;$('unmaskSelection').disabled=!ps||!q.masks.some(m=>m.start<ps.end&&m.end>ps.start)}
function renderFind(){const word=$('findText').value,q=current(),sel=$('occurrence');found=[];sel.replaceChildren();if(word){let at=0;while(at<=q.body.length-word.length){const i=q.body.indexOf(word,at);if(i<0)break;found.push({start:i,end:i+word.length});at=i+Math.max(1,word.length);if(found.length>=1000)break}}if(!found.length){const o=document.createElement('option');o.value='';o.textContent=word?'一致なし':'語句を入力';sel.append(o);sel.disabled=true;$('maskWord').disabled=true;return}found.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(i+1)+' / '+found.length+'：…'+q.body.slice(Math.max(0,r.start-10),r.start)+'【'+word+'】'+q.body.slice(r.end,r.end+10)+'…';sel.append(o)});sel.disabled=false;$('maskWord').disabled=false}
function renderEditor(){const q=current();$('deckTitle').value=state.title;$('questionTitle').value=q.title;$('subject').value=q.subject;$('body').value=q.body;$('bodyCount').textContent=q.body.length.toLocaleString()+'文字';$('position').textContent='論証 '+(active+1)+' / '+state.questions.length;renderPreview()}
function renderAll(){renderList();renderEditor()}
function switchTab(mask){$('textPane').hidden=mask;$('maskPane').hidden=!mask;$('textTab').classList.toggle('active',!mask);$('maskTab').classList.toggle('active',mask);if(mask){pendingSelection=null;renderPreview()}}
function addMask(start,end){const q=current();if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<=start||end>q.body.length)return;let ns=start,ne=end;const overlaps=q.masks.filter(m=>m.start<ne&&m.end>ns);for(const m of overlaps){ns=Math.min(ns,m.start);ne=Math.max(ne,m.end)}q.masks=q.masks.filter(m=>!overlaps.includes(m));q.masks.push({start:ns,end:ne,text:q.body.slice(ns,ne)});q.masks.sort((a,b)=>a.start-b.start);pendingSelection=null;window.getSelection()?.removeAllRanges();renderPreview();renderList();scheduleSave();toast('黒塗りを追加しました')}
function unmaskSelected(start,end){const q=current();if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<=start||end>q.body.length)return;const next=[];let changed=false;for(const m of q.masks){if(m.end<=start||m.start>=end){next.push(m);continue}changed=true;if(m.start<start)next.push({start:m.start,end:start,text:q.body.slice(m.start,start)});if(m.end>end)next.push({start:end,end:m.end,text:q.body.slice(end,m.end)})}if(!changed){toast('選択範囲に黒塗りがありません');return}q.masks=next.filter(m=>m.end>m.start).sort((a,b)=>a.start-b.start);pendingSelection=null;window.getSelection()?.removeAllRanges();renderPreview();renderList();scheduleSave();toast('選択範囲の黒塗りを解除しました')}
function captureSelection(){if($('maskPane').hidden)return;const s=window.getSelection();if(!s||s.rangeCount===0||s.isCollapsed){pendingSelection=null;$('maskSelection').disabled=true;$('unmaskSelection').disabled=true;return}const r=s.getRangeAt(0),root=$('preview');if(!root.contains(r.startContainer)||!root.contains(r.endContainer)){pendingSelection=null;$('maskSelection').disabled=true;$('unmaskSelection').disabled=true;return}const before=document.createRange();before.selectNodeContents(root);before.setEnd(r.startContainer,r.startOffset);let start=before.toString().length,end=start+r.toString().length;const body=current().body;while(start<end&&/\s/.test(body[start]))start++;while(end>start&&/\s/.test(body[end-1]))end--;pendingSelection=start<end?{start,end}:null;$('maskSelection').disabled=!pendingSelection;const q=current();$('unmaskSelection').disabled=!pendingSelection||!q.masks.some(m=>m.start<end&&m.end>start)}
function exportJSON(){try{if(!state.title.trim())throw new Error('教材名を入力してください。');if(!state.questions.length)throw new Error('論証がありません。');for(const [i,q] of state.questions.entries()){if(!q.title.trim())throw new Error((i+1)+'件目のタイトルを入力してください。');if(!q.body.trim())throw new Error((i+1)+'件目の本文を入力してください。');normalizeMasks(q)}state.updatedAt=now();saveNow();const blob=new Blob([JSON.stringify(state,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=state.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,80)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast(state.questions.length+'件を書き出しました')}catch(e){toast(e.message,true)}}
async function importJSON(file){const raw=JSON.parse((await file.text()).replace(/^\uFEFF/,''));if(!raw||raw.format!=='ankikun'||raw.version!==1||!Array.isArray(raw.questions)||!raw.questions.length)throw new Error('アンキー君形式のJSONではありません。');state={format:'ankikun',version:1,id:String(raw.id||uid()),title:String(raw.title||''),createdAt:String(raw.createdAt||now()),updatedAt:now(),questions:raw.questions.map(q=>({id:String(q.id||uid()),title:String(q.title||''),subject:String(q.subject||''),body:String(q.body||''),masks:Array.isArray(q.masks)?q.masks:[]}))};state.questions.forEach(normalizeMasks);active=0;showAnswers=false;pendingSelection=null;renderAll();saveNow();toast(state.questions.length+'件を読み込みました')}
restore();
$('deckTitle').oninput=()=>{state.title=$('deckTitle').value;scheduleSave()};
$('questionTitle').oninput=()=>{current().title=$('questionTitle').value;renderList();scheduleSave()};
$('subject').oninput=()=>{current().subject=$('subject').value;renderList();scheduleSave()};
$('body').oninput=()=>{const q=current();q.body=$('body').value;q.masks=[];$('bodyCount').textContent=q.body.length.toLocaleString()+'文字';renderList();scheduleSave()};
$('addQuestion').onclick=()=>{const q=newQuestion();q.subject=current()?.subject||'';state.questions.push(q);active=state.questions.length-1;switchTab(false);renderAll();scheduleSave();$('questionTitle').focus()};
$('duplicateBtn').onclick=()=>{const q=JSON.parse(JSON.stringify(current()));q.id=uid();q.title=(q.title||'無題')+'（コピー）';state.questions.splice(active+1,0,q);active++;renderAll();scheduleSave()};
$('deleteBtn').onclick=()=>{if(state.questions.length===1){state.questions=[newQuestion()];active=0}else{state.questions.splice(active,1);active=Math.min(active,state.questions.length-1)}renderAll();scheduleSave()};
$('textTab').onclick=()=>switchTab(false);$('maskTab').onclick=()=>switchTab(true);$('goMask').onclick=()=>switchTab(true);
$('preview').addEventListener('mouseup',captureSelection);$('preview').addEventListener('touchend',()=>setTimeout(captureSelection,0));document.addEventListener('selectionchange',captureSelection);
$('maskSelection').onpointerdown=e=>{if(e.pointerType==='mouse')e.preventDefault()};$('maskSelection').onclick=()=>{if(pendingSelection)addMask(pendingSelection.start,pendingSelection.end)};$('unmaskSelection').onclick=()=>{if(pendingSelection)unmaskSelected(pendingSelection.start,pendingSelection.end)};
$('toggleAnswers').onclick=()=>{showAnswers=!showAnswers;renderPreview()};
$('findText').oninput=renderFind;$('maskWord').onclick=()=>{const m=found[Number($('occurrence').value)];if(m)addMask(m.start,m.end)};
$('clearMasks').onclick=()=>{current().masks=[];renderPreview();renderList();scheduleSave()};
$('exportBtn').onclick=exportJSON;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await importJSON(f)}catch(err){toast(err.message,true)}finally{e.target.value=''}};
window.addEventListener('pagehide',saveNow);renderAll();
</script>
</body>
</html>
