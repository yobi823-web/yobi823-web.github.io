<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M4A Player">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>M4A Player</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151923;--panel2:#1c2230;--line:#2a3242;--text:#f5f7fb;--muted:#929bad;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif}
button,input{font:inherit}button{color:inherit}.app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:calc(18px + var(--safeT)) 16px calc(155px + var(--safeB))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:24px;margin:0}.sub,.hint,.meta,.count{color:var(--muted)}.sub{font-size:12px;margin-top:4px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;min-height:44px;padding:10px 14px;cursor:pointer}.btn.primary{background:#f5f7fb;color:#0b0d12;border:0;font-weight:700}.row .btn{flex:1;min-width:145px}.hint{font-size:12px;line-height:1.55;margin:11px 2px 0}#file{display:none}
.playlists{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}.playlists::-webkit-scrollbar{display:none}.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:13px}.pill.active{background:#f5f7fb;color:#0b0d12;border-color:#f5f7fb;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;gap:10px}.head strong{font-size:15px}.headright{display:flex;align-items:center;gap:8px}.count{font-size:12px}.tiny{border:1px solid var(--line);background:var(--panel);border-radius:11px;min-height:34px;padding:6px 10px;font-size:12px}
.library{display:grid;gap:8px}.empty{border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.65}
.track{display:grid;grid-template-columns:46px minmax(0,1fr) 40px;gap:10px;align-items:center;min-height:64px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.track.active{background:#1d2330;border-color:#687287}.mini{width:46px;height:46px;border:0;border-radius:14px;background:#272e3d;font-size:18px}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:650}.meta{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu{width:38px;height:38px;border:0;background:transparent;color:var(--muted);font-size:22px}
.player{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:12px 14px calc(12px + var(--safeB));background:rgba(15,18,25,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:20}.now{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.nowtitle{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:650}.time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.seek{width:100%;height:22px;accent-color:#fff}.controls{display:grid;grid-template-columns:1fr 46px 58px 46px 1fr;gap:6px;align-items:center}.ctl{border:0;background:transparent;height:44px;border-radius:14px;font-size:21px}.ctl.side{font-size:15px;color:var(--muted)}.ctl.main{height:52px;width:58px;justify-self:center;background:#f5f7fb;color:#0b0d12;border-radius:18px;font-size:24px}.ctl.active{background:#252c3a;color:#fff}.speed{justify-self:end;font-size:12px;min-width:50px}
.toast{position:fixed;left:50%;bottom:calc(160px + var(--safeB));transform:translateX(-50%);opacity:0;pointer-events:none;background:#f5f7fb;color:#111318;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:650;transition:.2s;z-index:80;max-width:82vw;text-align:center}.toast.show{opacity:1}
.sheetbg{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:50}.sheetbg.open{display:flex}.sheet{width:min(760px,100%);max-height:78dvh;overflow:auto;margin:auto;background:#171b24;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + var(--safeB))}.sheettitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:4px 2px 12px}.sheet button{width:100%;border:0;background:#232936;border-radius:14px;min-height:48px;margin-top:8px;padding:10px 12px}.sheet .secondary{background:#1d222d}.danger{color:#ff6b6b}
@media(min-width:600px){.app,.player{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>M4A Player</h1><div class="sub">端末内の音声を端末内だけで再生</div></div><button class="btn" id="clear">全削除</button></header>

<section class="card">
<div class="row"><button class="btn primary" id="pick">＋ 音声を追加</button><button class="btn" id="shuffle">シャッフル再生</button></div>
<input id="file" type="file" multiple accept="audio/mp4,audio/x-m4a,audio/m4a,audio/aac,audio/mpeg,audio/wav,.m4a,.mp3,.aac,.wav">
<p class="hint">「ファイル」アプリから M4A / MP3 / AAC / WAV を選択。音声はブラウザの端末内ストレージに保存されます。</p>
</section>

<div class="playlists" id="playlistTabs"></div>

<div class="head">
  <strong id="viewTitle">ライブラリ</strong>
  <div class="headright"><span class="count" id="count">0曲</span><button class="tiny" id="playlistAction" hidden>編集</button></div>
</div>
<section class="library" id="library"></section>
</main>

<section class="player">
<div class="now"><div class="nowtitle" id="now">音声を選択してください</div><div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div></div>
<input class="seek" id="seek" type="range" min="0" max="1000" value="0">
<div class="controls"><button class="ctl side" id="repeat">↻</button><button class="ctl" id="prev">⏮</button><button class="ctl main" id="play">▶</button><button class="ctl" id="next">⏭</button><button class="ctl side speed" id="speed">1×</button></div>
</section>

<div class="toast" id="toast"></div>

<div class="sheetbg" id="sheetbg"><div class="sheet">
  <div class="sheettitle" id="sheettitle"></div>
  <button id="sheetplay">この曲を再生</button>
  <button id="sheetadd">プレイリストに追加</button>
  <button id="sheetremove" class="secondary" hidden>このプレイリストから外す</button>
  <button id="sheetdelete" class="danger">ライブラリから削除</button>
  <button id="sheetclose" class="secondary">閉じる</button>
</div></div>

<div class="sheetbg" id="listbg"><div class="sheet">
  <div class="sheettitle">追加先のプレイリスト</div>
  <div id="listbuttons"></div>
  <button id="newFromList">＋ 新しいプレイリスト</button>
  <button id="listclose" class="secondary">閉じる</button>
</div></div>

<div class="sheetbg" id="playlistbg"><div class="sheet">
  <div class="sheettitle" id="playlistSheetTitle">プレイリスト</div>
  <button id="playPlaylist">先頭から再生</button>
  <button id="renamePlaylist">名前を変更</button>
  <button id="deletePlaylist" class="danger">プレイリストを削除</button>
  <button id="playlistClose" class="secondary">閉じる</button>
</div></div>

<audio id="audio" preload="metadata"></audio>

<script>
const DB='m4a-player-db',STORE='tracks',PLKEY='m4a-player-playlists-v1';
let db,tracks=[],playlists=[],activeList='all',currentId=null,currentUrl=null,repeatMode=0,shuffle=false,menuId=null,speedIndex=0;
const speeds=[1,1.25,1.5,1.75,2,.75];
const $=s=>document.querySelector(s),audio=$('#audio'),lib=$('#library'),file=$('#file'),seek=$('#seek');

function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function all(){return new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function put(x){return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function del(id){return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function clearDB(){return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function loadPlaylists(){try{const x=JSON.parse(localStorage.getItem(PLKEY)||'[]');playlists=Array.isArray(x)?x:[]}catch(e){playlists=[]}}
function savePlaylists(){localStorage.setItem(PLKEY,JSON.stringify(playlists))}
function cleanPlaylists(){const ids=new Set(tracks.map(t=>t.id));let changed=false;playlists.forEach(p=>{const next=p.tracks.filter(id=>ids.has(id));if(next.length!==p.tracks.length){p.tracks=next;changed=true}});if(changed)savePlaylists()}
function name(n){return n.replace(/\.(m4a|mp3|aac|wav|mp4)$/i,'')}
function size(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function time(s){if(!Number.isFinite(s))return'0:00';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function activePlaylist(){return playlists.find(p=>p.id===activeList)||null}
function visibleTracks(){const p=activePlaylist();if(!p)return tracks;const map=new Map(tracks.map(t=>[t.id,t]));return p.tracks.map(i=>map.get(i)).filter(Boolean)}
function queue(){return visibleTracks().map(t=>t.id)}
function queueIndex(){return queue().indexOf(currentId)}
function choose(d=1){const q=queue();if(!q.length)return null;if(shuffle&&q.length>1){let i=q.indexOf(currentId),j=i;while(j===i)j=Math.floor(Math.random()*q.length);return q[j]}let i=q.indexOf(currentId);i=i<0?(d>0?-1:0):i;return q[(i+d+q.length)%q.length]}

function renderTabs(){
  const box=$('#playlistTabs');box.innerHTML='';
  const allBtn=document.createElement('button');allBtn.className='pill'+(activeList==='all'?' active':'');allBtn.textContent='ライブラリ';allBtn.onclick=()=>setList('all');box.append(allBtn);
  playlists.forEach(p=>{const b=document.createElement('button');b.className='pill'+(activeList===p.id?' active':'');b.textContent=p.name+' · '+p.tracks.length;b.onclick=()=>setList(p.id);box.append(b)});
  const add=document.createElement('button');add.className='pill';add.textContent='＋ 新規';add.onclick=()=>createPlaylist();box.append(add);
}
function render(){
  renderTabs();
  const p=activePlaylist(),shown=visibleTracks();
  $('#viewTitle').textContent=p?p.name:'ライブラリ';
  $('#count').textContent=shown.length+'曲';
  $('#playlistAction').hidden=!p;
  if(!shown.length){lib.innerHTML='<div class="empty">'+(p?'このプレイリストにはまだ曲がありません。<br>曲の「⋯」→「プレイリストに追加」から追加できます。':'まだ音声がありません。<br>「＋ 音声を追加」からM4Aを選んでください。')+'</div>';return}
  lib.innerHTML='';
  shown.forEach(t=>{
    const row=document.createElement('article');row.className='track'+(t.id===currentId?' active':'');row.dataset.id=t.id;
    const pbtn=document.createElement('button');pbtn.className='mini';pbtn.textContent=t.id===currentId&&!audio.paused?'❚❚':'▶';
    const mid=document.createElement('div'),tt=document.createElement('div'),mm=document.createElement('div'),m=document.createElement('button');
    tt.className='title';tt.textContent=name(t.name);mm.className='meta';mm.textContent=size(t.size)+' · '+(t.type||'audio');mid.append(tt,mm);
    m.className='menu';m.textContent='⋯';
    pbtn.onclick=()=>t.id===currentId?toggle():load(t.id,true);mid.onclick=()=>load(t.id,true);m.onclick=()=>sheet(t.id);
    row.append(pbtn,mid,m);lib.append(row);
  });
}
function setList(i){activeList=i;render();const q=queue();if(q.length&&!q.includes(currentId)){load(q[0],false)}}
function createPlaylist(prefill){
  const n=prompt('プレイリスト名',prefill||'新しいプレイリスト');
  if(n===null)return null;const trimmed=n.trim();if(!trimmed)return toast('名前を入力してください'),null;
  const p={id:'pl-'+id(),name:trimmed,tracks:[]};playlists.push(p);savePlaylists();activeList=p.id;render();toast('プレイリストを作成しました');return p;
}
function addToPlaylist(pid,tid){
  const p=playlists.find(x=>x.id===pid);if(!p)return;
  if(p.tracks.includes(tid))return toast('すでに追加されています');
  p.tracks.push(tid);savePlaylists();render();toast('「'+p.name+'」に追加しました');
}
function removeFromActive(tid){
  const p=activePlaylist();if(!p)return;p.tracks=p.tracks.filter(x=>x!==tid);savePlaylists();render();toast('プレイリストから外しました');
}
async function importFiles(fs){
  const a=[...fs].filter(f=>/\.(m4a|mp3|aac|wav|mp4)$/i.test(f.name)||f.type.startsWith('audio/'));if(!a.length)return toast('対応する音声ファイルがありません');
  let n=0;for(const f of a){if(tracks.some(t=>t.name===f.name&&t.size===f.size&&t.lastModified===f.lastModified))continue;
    const x={id:id(),name:f.name,type:f.type||'audio/mp4',size:f.size,lastModified:f.lastModified||0,createdAt:Date.now(),blob:f};
    try{await put(x);tracks.push(x);n++}catch(e){console.error(e);toast('保存容量が足りない可能性があります');break}}
  tracks.sort((a,b)=>a.createdAt-b.createdAt);render();toast(n?n+'曲追加しました':'同じファイルは追加済みです');if(!currentId&&tracks.length)load(tracks[0].id,false)
}
function media(t){
  if(!('mediaSession'in navigator))return;
  try{
    const p=activePlaylist();
    navigator.mediaSession.metadata=new MediaMetadata({title:name(t.name),artist:'端末内の音声',album:p?p.name:'M4A Player'});
    navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack',()=>{const x=choose(-1);if(x)load(x,true)});navigator.mediaSession.setActionHandler('nexttrack',()=>{const x=choose(1);if(x)load(x,true)});
    navigator.mediaSession.setActionHandler('seekto',e=>{if(Number.isFinite(e.seekTime))audio.currentTime=Math.min(e.seekTime,audio.duration||e.seekTime)});
    navigator.mediaSession.setActionHandler('seekbackward',e=>audio.currentTime=Math.max(0,audio.currentTime-(e.seekOffset||10)));
    navigator.mediaSession.setActionHandler('seekforward',e=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+(e.seekOffset||10)));
  }catch(e){}
}
function load(i,auto=false){
  const t=tracks.find(x=>x.id===i);if(!t)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(t.blob);currentId=i;audio.src=currentUrl;audio.playbackRate=speeds[speedIndex];
  $('#now').textContent=name(t.name);document.title=name(t.name)+' · M4A Player';media(t);render();if(auto)audio.play().catch(()=>toast('再生ボタンを押してください'))
}
function toggle(){if(!currentId){const q=queue();if(q.length)load(q[0],false)}if(!currentId)return toast('音声を追加してください');audio.paused?audio.play().catch(()=>toast('再生できませんでした')):audio.pause()}
function update(){
  $('#play').textContent=audio.paused?'▶':'❚❚';$('#cur').textContent=time(audio.currentTime);$('#dur').textContent=time(audio.duration);
  seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0;
  document.querySelectorAll('.track').forEach(r=>{const a=r.dataset.id===currentId;r.classList.toggle('active',a);const b=r.querySelector('.mini');if(b)b.textContent=a&&!audio.paused?'❚❚':'▶'});
  if('mediaSession'in navigator&&Number.isFinite(audio.duration)&&audio.duration>0)try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)})}catch(e){}
}
function sheet(i){const t=tracks.find(x=>x.id===i);if(!t)return;menuId=i;$('#sheettitle').textContent=name(t.name);$('#sheetremove').hidden=!activePlaylist();$('#sheetbg').classList.add('open')}
function closeSheet(){$('#sheetbg').classList.remove('open');menuId=null}
function openListPicker(tid){
  menuId=tid;const box=$('#listbuttons');box.innerHTML='';
  playlists.forEach(p=>{const b=document.createElement('button');b.textContent=(p.tracks.includes(tid)?'✓ ':'')+p.name+' ('+p.tracks.length+'曲)';b.onclick=()=>{addToPlaylist(p.id,tid);$('#listbg').classList.remove('open')};box.append(b)});
  $('#listbg').classList.add('open');
}
function closeListPicker(){$('#listbg').classList.remove('open')}
function openPlaylistSheet(){const p=activePlaylist();if(!p)return;$('#playlistSheetTitle').textContent=p.name;$('#playlistbg').classList.add('open')}
function closePlaylistSheet(){$('#playlistbg').classList.remove('open')}

$('#pick').onclick=()=>file.click();file.onchange=async()=>{await importFiles(file.files);file.value=''};
$('#play').onclick=toggle;$('#prev').onclick=()=>{const x=choose(-1);if(x)load(x,true)};$('#next').onclick=()=>{const x=choose(1);if(x)load(x,true)};
seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=(+seek.value/1000)*audio.duration};
$('#repeat').onclick=()=>{repeatMode=(repeatMode+1)%3;const b=$('#repeat');b.textContent=repeatMode===2?'↻¹':'↻';b.classList.toggle('active',repeatMode>0);toast(repeatMode===0?'リピートOFF':repeatMode===1?'全曲リピート':'1曲リピート')};
$('#shuffle').onclick=()=>{const q=queue();if(!q.length)return toast('再生する曲がありません');shuffle=!shuffle;$('#shuffle').textContent=shuffle?'シャッフル：ON':'シャッフル再生';if(shuffle)load(q[Math.floor(Math.random()*q.length)],true)};
$('#speed').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;audio.playbackRate=speeds[speedIndex];$('#speed').textContent=speeds[speedIndex]+'×';toast('再生速度 '+speeds[speedIndex]+'×')};

$('#playlistAction').onclick=openPlaylistSheet;
$('#playPlaylist').onclick=()=>{const q=queue();closePlaylistSheet();if(q.length)load(q[0],true);else toast('曲がありません')};
$('#renamePlaylist').onclick=()=>{const p=activePlaylist();if(!p)return;const n=prompt('新しい名前',p.name);if(n===null)return;const x=n.trim();if(!x)return toast('名前を入力してください');p.name=x;savePlaylists();closePlaylistSheet();render();toast('名前を変更しました')};
$('#deletePlaylist').onclick=()=>{const p=activePlaylist();if(!p)return;if(!confirm('「'+p.name+'」を削除しますか？\\n曲そのものはライブラリに残ります。'))return;playlists=playlists.filter(x=>x.id!==p.id);savePlaylists();activeList='all';closePlaylistSheet();render();toast('プレイリストを削除しました')};
$('#playlistClose').onclick=closePlaylistSheet;$('#playlistbg').onclick=e=>{if(e.target===$('#playlistbg'))closePlaylistSheet()};

$('#sheetplay').onclick=()=>{const i=menuId;if(i)load(i,true);closeSheet()};
$('#sheetadd').onclick=()=>{const i=menuId;if(!i)return;$('#sheetbg').classList.remove('open');openListPicker(i)};
$('#sheetremove').onclick=()=>{const i=menuId;if(i)removeFromActive(i);closeSheet()};
$('#sheetdelete').onclick=async()=>{const i=menuId;if(!i)return;const was=i===currentId;await del(i);tracks=tracks.filter(t=>t.id!==i);playlists.forEach(p=>p.tracks=p.tracks.filter(x=>x!==i));savePlaylists();closeSheet();
  if(was){audio.pause();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;audio.removeAttribute('src');audio.load();const q=queue();if(q.length)load(q[0],false);else $('#now').textContent='音声を選択してください'}
  render();update();toast('ライブラリから削除しました')
};
$('#sheetclose').onclick=closeSheet;$('#sheetbg').onclick=e=>{if(e.target===$('#sheetbg'))closeSheet()};

$('#newFromList').onclick=()=>{const tid=menuId;closeListPicker();const p=createPlaylist();if(p&&tid)addToPlaylist(p.id,tid)};
$('#listclose').onclick=closeListPicker;$('#listbg').onclick=e=>{if(e.target===$('#listbg'))closeListPicker()};

$('#clear').onclick=async()=>{if(!tracks.length||!confirm('ライブラリの音声をすべて削除しますか？\\nプレイリストも空になります。'))return;audio.pause();audio.removeAttribute('src');audio.load();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;await clearDB();tracks=[];playlists.forEach(p=>p.tracks=[]);savePlaylists();$('#now').textContent='音声を選択してください';document.title='M4A Player';render();update();toast('ライブラリを空にしました')};

['play','pause','timeupdate','loadedmetadata','ratechange'].forEach(e=>audio.addEventListener(e,update));
audio.addEventListener('ended',()=>{if(repeatMode===2){audio.currentTime=0;audio.play();return}const q=queue(),i=q.indexOf(currentId);if(!shuffle&&repeatMode===0&&i===q.length-1){update();return}const x=choose(1);if(x)load(x,true)});
audio.addEventListener('error',()=>toast('この音声はSafariで再生できない形式かもしれません'));
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});

(async()=>{try{db=await openDB();tracks=await all();tracks.sort((a,b)=>a.createdAt-b.createdAt);loadPlaylists();cleanPlaylists();render();if(tracks.length)load(tracks[0].id,false)}catch(e){console.error(e);loadPlaylists();render();toast('ブラウザ内ストレージを利用できません')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script>
</body>
</html>
