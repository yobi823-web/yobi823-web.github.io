<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M4A Player">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>M4A Player</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151923;--panel2:#1c2230;--line:#2a3242;--text:#f5f7fb;--muted:#929bad;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif}button,input{font:inherit}button{color:inherit}
.app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:calc(18px + var(--safeT)) 16px calc(155px + var(--safeB))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:24px;margin:0}.sub,.hint,.meta,.count{color:var(--muted)}.sub{font-size:12px;margin-top:4px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;min-height:44px;padding:10px 14px;cursor:pointer}.btn.primary{background:#f5f7fb;color:#0b0d12;border:0;font-weight:700}.row .btn{flex:1;min-width:145px}.hint{font-size:12px;line-height:1.55;margin:11px 2px 0}#file{display:none}
.head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.head strong{font-size:15px}.count{font-size:12px}.library{display:grid;gap:8px}.empty{border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.track{display:grid;grid-template-columns:46px minmax(0,1fr) 40px;gap:10px;align-items:center;min-height:64px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.track.active{background:#1d2330;border-color:#687287}.mini{width:46px;height:46px;border:0;border-radius:14px;background:#272e3d;font-size:18px}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:650}.meta{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu{width:38px;height:38px;border:0;background:transparent;color:var(--muted);font-size:22px}
.player{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:12px 14px calc(12px + var(--safeB));background:rgba(15,18,25,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:20}.now{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.nowtitle{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:650}.time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.seek{width:100%;height:22px;accent-color:#fff}.controls{display:grid;grid-template-columns:1fr 46px 58px 46px 1fr;gap:6px;align-items:center}.ctl{border:0;background:transparent;height:44px;border-radius:14px;font-size:21px}.ctl.side{font-size:15px;color:var(--muted)}.ctl.main{height:52px;width:58px;justify-self:center;background:#f5f7fb;color:#0b0d12;border-radius:18px;font-size:24px}.ctl.active{background:#252c3a;color:#fff}.speed{justify-self:end;font-size:12px;min-width:50px}
.toast{position:fixed;left:50%;bottom:calc(160px + var(--safeB));transform:translateX(-50%);opacity:0;pointer-events:none;background:#f5f7fb;color:#111318;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:650;transition:.2s;z-index:40;max-width:82vw;text-align:center}.toast.show{opacity:1}
.sheetbg{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:50}.sheetbg.open{display:flex}.sheet{width:min(760px,100%);margin:auto;background:#171b24;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + var(--safeB))}.sheettitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:4px 2px 12px}.sheet button{width:100%;border:0;background:#232936;border-radius:14px;min-height:48px;margin-top:8px}.danger{color:#ff6b6b}
@media(min-width:600px){.app,.player{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>M4A Player</h1><div class="sub">端末内の音声を端末内だけで再生</div></div><button class="btn" id="clear">全削除</button></header>
<section class="card">
<div class="row"><button class="btn primary" id="pick">＋ 音声を追加</button><button class="btn" id="shuffle">シャッフル再生</button></div>
<input id="file" type="file" multiple accept="audio/mp4,audio/x-m4a,audio/m4a,audio/aac,audio/mpeg,audio/wav,.m4a,.mp3,.aac,.wav">
<p class="hint">「ファイル」アプリから M4A / MP3 / AAC / WAV を選択。追加した音声はこのブラウザの端末内ストレージに保存され、ページを閉じても残ります。</p>
</section>
<div class="head"><strong>ライブラリ</strong><span class="count" id="count">0曲</span></div>
<section class="library" id="library"></section>
</main>
<section class="player">
<div class="now"><div class="nowtitle" id="now">音声を選択してください</div><div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div></div>
<input class="seek" id="seek" type="range" min="0" max="1000" value="0">
<div class="controls"><button class="ctl side" id="repeat">↻</button><button class="ctl" id="prev">⏮</button><button class="ctl main" id="play">▶</button><button class="ctl" id="next">⏭</button><button class="ctl side speed" id="speed">1×</button></div>
</section>
<div class="toast" id="toast"></div>
<div class="sheetbg" id="sheetbg"><div class="sheet"><div class="sheettitle" id="sheettitle"></div><button id="sheetplay">この曲を再生</button><button id="sheetdelete" class="danger">ライブラリから削除</button><button id="sheetclose">閉じる</button></div></div>
<audio id="audio" preload="metadata"></audio>
<script>
const DB='m4a-player-db',STORE='tracks';let db,tracks=[],currentId=null,currentUrl=null,repeatMode=0,shuffle=false,menuId=null,speedIndex=0;const speeds=[1,1.25,1.5,1.75,2,.75];const $=s=>document.querySelector(s),audio=$('#audio'),lib=$('#library'),file=$('#file'),seek=$('#seek');
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function all(){return new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function put(x){return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function del(id){return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function clearDB(){return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function name(n){return n.replace(/\.(m4a|mp3|aac|wav|mp4)$/i,'')}function size(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}function time(s){if(!Number.isFinite(s))return'0:00';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function render(){const c=$('#count');c.textContent=tracks.length+'曲';if(!tracks.length){lib.innerHTML='<div class="empty">まだ音声がありません。<br>「＋ 音声を追加」からM4Aを選んでください。</div>';return}lib.innerHTML='';tracks.forEach(t=>{const row=document.createElement('article');row.className='track'+(t.id===currentId?' active':'');row.dataset.id=t.id;const p=document.createElement('button');p.className='mini';p.textContent=t.id===currentId&&!audio.paused?'❚❚':'▶';const mid=document.createElement('div');const tt=document.createElement('div');tt.className='title';tt.textContent=name(t.name);const mm=document.createElement('div');mm.className='meta';mm.textContent=size(t.size)+' · '+(t.type||'audio');mid.append(tt,mm);const m=document.createElement('button');m.className='menu';m.textContent='⋯';p.onclick=()=>t.id===currentId?toggle():load(t.id,true);mid.onclick=()=>load(t.id,true);m.onclick=()=>sheet(t.id);row.append(p,mid,m);lib.append(row)})}
async function importFiles(fs){const a=[...fs].filter(f=>/\.(m4a|mp3|aac|wav|mp4)$/i.test(f.name)||f.type.startsWith('audio/'));if(!a.length)return toast('対応する音声ファイルがありません');let n=0;for(const f of a){if(tracks.some(t=>t.name===f.name&&t.size===f.size&&t.lastModified===f.lastModified))continue;const x={id:id(),name:f.name,type:f.type||'audio/mp4',size:f.size,lastModified:f.lastModified||0,createdAt:Date.now(),blob:f};try{await put(x);tracks.push(x);n++}catch(e){console.error(e);toast('保存容量が足りない可能性があります');break}}tracks.sort((a,b)=>a.createdAt-b.createdAt);render();toast(n?n+'曲追加しました':'同じファイルは追加済みです');if(!currentId&&tracks.length)load(tracks[0].id,false)}
function idx(){return tracks.findIndex(t=>t.id===currentId)}function choose(d=1){if(!tracks.length)return null;if(shuffle&&tracks.length>1){let i=idx(),j=i;while(j===i)j=Math.floor(Math.random()*tracks.length);return tracks[j].id}let i=idx();i=i<0?0:(i+d+tracks.length)%tracks.length;return tracks[i].id}
function media(t){if(!('mediaSession'in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:name(t.name),artist:'端末内の音声',album:'M4A Player'});navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());navigator.mediaSession.setActionHandler('previoustrack',()=>{const x=choose(-1);if(x)load(x,true)});navigator.mediaSession.setActionHandler('nexttrack',()=>{const x=choose(1);if(x)load(x,true)});navigator.mediaSession.setActionHandler('seekto',e=>{if(Number.isFinite(e.seekTime))audio.currentTime=Math.min(e.seekTime,audio.duration||e.seekTime)});navigator.mediaSession.setActionHandler('seekbackward',e=>audio.currentTime=Math.max(0,audio.currentTime-(e.seekOffset||10)));navigator.mediaSession.setActionHandler('seekforward',e=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+(e.seekOffset||10)))}catch(e){}}
function load(i,auto=false){const t=tracks.find(x=>x.id===i);if(!t)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(t.blob);currentId=i;audio.src=currentUrl;audio.playbackRate=speeds[speedIndex];$('#now').textContent=name(t.name);document.title=name(t.name)+' · M4A Player';media(t);render();if(auto)audio.play().catch(()=>toast('再生ボタンを押してください'))}
function toggle(){if(!currentId&&tracks.length)load(tracks[0].id,false);if(!currentId)return toast('音声を追加してください');audio.paused?audio.play().catch(()=>toast('再生できませんでした')):audio.pause()}
function update(){ $('#play').textContent=audio.paused?'▶':'❚❚';$('#cur').textContent=time(audio.currentTime);$('#dur').textContent=time(audio.duration);seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0;document.querySelectorAll('.track').forEach(r=>{const a=r.dataset.id===currentId;r.classList.toggle('active',a);const b=r.querySelector('.mini');if(b)b.textContent=a&&!audio.paused?'❚❚':'▶'});if('mediaSession'in navigator&&Number.isFinite(audio.duration)&&audio.duration>0)try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)})}catch(e){}}
function sheet(i){const t=tracks.find(x=>x.id===i);if(!t)return;menuId=i;$('#sheettitle').textContent=name(t.name);$('#sheetbg').classList.add('open')}function closeSheet(){$('#sheetbg').classList.remove('open');menuId=null}
$('#pick').onclick=()=>file.click();file.onchange=async()=>{await importFiles(file.files);file.value=''};$('#play').onclick=toggle;$('#prev').onclick=()=>{const x=choose(-1);if(x)load(x,true)};$('#next').onclick=()=>{const x=choose(1);if(x)load(x,true)};seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=(+seek.value/1000)*audio.duration};
$('#repeat').onclick=()=>{repeatMode=(repeatMode+1)%3;const b=$('#repeat');b.textContent=repeatMode===2?'↻¹':'↻';b.classList.toggle('active',repeatMode>0);toast(repeatMode===0?'リピートOFF':repeatMode===1?'全曲リピート':'1曲リピート')};
$('#shuffle').onclick=()=>{if(!tracks.length)return toast('音声を追加してください');shuffle=!shuffle;$('#shuffle').textContent=shuffle?'シャッフル：ON':'シャッフル再生';if(shuffle)load(tracks[Math.floor(Math.random()*tracks.length)].id,true)};
$('#speed').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;audio.playbackRate=speeds[speedIndex];$('#speed').textContent=speeds[speedIndex]+'×';toast('再生速度 '+speeds[speedIndex]+'×')};
$('#clear').onclick=async()=>{if(!tracks.length||!confirm('ライブラリの音声をすべて削除しますか？'))return;audio.pause();audio.removeAttribute('src');audio.load();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;await clearDB();tracks=[];$('#now').textContent='音声を選択してください';document.title='M4A Player';render();update();toast('ライブラリを空にしました')};
$('#sheetplay').onclick=()=>{if(menuId)load(menuId,true);closeSheet()};$('#sheetdelete').onclick=async()=>{const i=menuId;if(!i)return;const was=i===currentId;await del(i);tracks=tracks.filter(t=>t.id!==i);closeSheet();if(was){audio.pause();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=null;currentId=null;audio.removeAttribute('src');audio.load();if(tracks.length)load(tracks[0].id,false);else $('#now').textContent='音声を選択してください'}render();update();toast('削除しました')};$('#sheetclose').onclick=closeSheet;$('#sheetbg').onclick=e=>{if(e.target===$('#sheetbg'))closeSheet()};
['play','pause','timeupdate','loadedmetadata','ratechange'].forEach(e=>audio.addEventListener(e,update));audio.addEventListener('ended',()=>{if(repeatMode===2){audio.currentTime=0;audio.play();return}const i=idx();if(!shuffle&&repeatMode===0&&i===tracks.length-1){update();return}const x=choose(1);if(x)load(x,true)});audio.addEventListener('error',()=>toast('この音声はSafariで再生できない形式かもしれません'));
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});
(async()=>{try{db=await openDB();tracks=await all();tracks.sort((a,b)=>a.createdAt-b.createdAt);render();if(tracks.length)load(tracks[0].id,false)}catch(e){console.error(e);render();toast('ブラウザ内ストレージを利用できません')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script>
</body>
</html>
