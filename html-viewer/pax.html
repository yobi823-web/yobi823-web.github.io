<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PAX 駒台座 3Dプレビュー</title>
<style>
:root{--bg:#ece6d8;--pn:#f7f2e6;--ln:#a99d80;--tx:#26221b;--bt:#ddd3bb;--ac:#8c2f1b;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a16;--pn:#27231e;--ln:#554d3f;--tx:#eee7d8;--bt:#38322a}}
:root[data-theme="dark"]{--bg:#1c1a16;--pn:#27231e;--ln:#554d3f;--tx:#eee7d8;--bt:#38322a}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
#v{height:46vh;min-height:280px;touch-action:none}#v canvas{display:block;width:100%;height:100%}
.p{margin:8px;padding:8px 10px;background:var(--pn);border:1px solid var(--ln);border-radius:10px}
.r{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0}.r b{min-width:3.4em}
button{font:inherit;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--ln);background:var(--bt);color:var(--tx)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#info{line-height:1.6}small{opacity:.8;line-height:1.5;display:block;margin-top:6px}
</style></head><body>
<div id="v"></div>
<div class="p" id="info"></div>
<div class="p" id="ui"></div>
<div class="p"><small>ドラッグで回転、2本指で拡大縮小。<br>台座の扇形は駒の向きと一緒に回ります（緑＝正面と斜め前：0、黄＝側面：−3、赤＝真後ろ：−5）。手前の銘板に、現在の攻撃値・防御値と兵数を出しています。</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T={I:{n:'歩兵',b:4,f:{yoko:['横陣',2,2,''],hoshi:['鋒矢陣',4,0,''],hoi:['包囲陣',1,1,'包囲支援を＋2で出せる'],taiki:['対騎陣',0,0,'敵騎兵が正面なら＋10']}},
A:{n:'弓兵',b:2,f:{retsu:['横列陣',-2,-2,'支援＋2（射程3）'],san:['散開陣',0,0,'支援＋1（射程3）'],han:['半月陣',0,0,'支援＋4（正面一直線の1〜3マス）']}},
C:{n:'騎兵',b:3,f:{hoshi:['鋒矢陣',0,-3,'突撃に＋4を追加'],tei:['梯形陣',0,0,'斜め前にも攻撃（側面扱い）'],san:['散開陣',0,3,'']}},
K:{n:'指揮官',b:5,f:{none:['―',0,0,'距離2以内の味方歩兵に＋1']}}},KJ={I:'歩',A:'弓',C:'騎',K:'将'};
let S={t:'I',f:'yoko',hp:3,d:0,o:0};const $=i=>document.getElementById(i),v=$('v');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));v.appendChild(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,1,500);
sc.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(40,80,60);sc.add(dl);
const base=new THREE.Mesh(new THREE.CylinderGeometry(17,18,5,48),new THREE.MeshLambertMaterial({color:0xb8352a}));base.position.y=2.5;sc.add(base);
const F=new THREE.Group();F.position.y=5;sc.add(F);
const disc=new THREE.Mesh(new THREE.CylinderGeometry(14,14,3,48),new THREE.MeshLambertMaterial({color:0xefe6d0}));disc.position.y=1.5;F.add(disc);
const dc=document.createElement('canvas');dc.width=dc.height=512;const dt=new THREE.CanvasTexture(dc);
const top=new THREE.Mesh(new THREE.CircleGeometry(14,48),new THREE.MeshBasicMaterial({map:dt}));top.rotation.x=-Math.PI/2;top.position.y=3.05;F.add(top);
const wd=new THREE.Mesh(new THREE.ConeGeometry(4.5,9,3),new THREE.MeshLambertMaterial({color:0x222222}));wd.rotation.x=-Math.PI/2;wd.position.set(0,1.5,-17);F.add(wd);
const pc=document.createElement('canvas');pc.width=512;pc.height=170;const pt=new THREE.CanvasTexture(pc);
const pl=new THREE.Mesh(new THREE.PlaneGeometry(26,8.6),new THREE.MeshBasicMaterial({map:pt}));pl.position.set(0,3.2,17.8);pl.rotation.x=-.45;sc.add(pl);
function draw(){const ty=T[S.t],f=ty.f[S.f],pen=3-S.hp,atk=ty.b+f[1]-pen,df=ty.b+f[2]-pen,rd=Math.PI/180;
 const g=dc.getContext('2d');g.clearRect(0,0,512,512);
 const sec=(a,b,col,lab,m)=>{g.beginPath();g.moveTo(256,256);g.arc(256,256,250,a*rd,b*rd);g.closePath();g.fillStyle=col;g.fill();g.fillStyle='#222';g.font='bold 54px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(lab,256+Math.cos(m*rd)*195,256+Math.sin(m*rd)*195)};
 sec(-157.5,-22.5,'#8cc77a','0',-90);sec(-22.5,67.5,'#ecc65a','−3',22.5);sec(67.5,112.5,'#e0705a','−5',90);sec(112.5,202.5,'#ecc65a','−3',157.5);
 g.beginPath();g.arc(256,256,118,0,7);g.fillStyle='#f4ecd8';g.fill();g.fillStyle='#222';g.textAlign='center';g.textBaseline='middle';g.font='bold 120px "Hiragino Sans","Noto Sans JP",sans-serif';g.fillText(KJ[S.t],256,232);g.font='bold 52px "Hiragino Sans","Noto Sans JP",sans-serif';g.fillText(f[0],256,324);
 const p=pc.getContext('2d');p.fillStyle='#2b2620';p.fillRect(0,0,512,170);p.fillStyle='#f4ecd8';p.textAlign='center';p.textBaseline='middle';p.font='bold 62px "Hiragino Sans","Noto Sans JP",sans-serif';p.fillText('攻 '+atk+'　防 '+df,256,62);p.font='48px sans-serif';p.fillText('●'.repeat(S.hp)+'○'.repeat(3-S.hp),256,134);
 dt.needsUpdate=pt.needsUpdate=true;base.material.color.set(S.o?0x245fa8:0xb8352a);
 $('info').innerHTML='<b>'+ty.n+'　'+f[0]+'</b>　攻撃 <b>'+atk+'</b>／防御 <b>'+df+'</b>（基礎'+ty.b+'＋陣形'+f[1]+'/'+f[2]+'−兵数'+pen+'）'+(f[3]?'<br>'+f[3]:'')}
function set(k,x){S[k]=x;if(k=='t')S.f=Object.keys(T[x].f)[0];draw();ui()}
function ui(){const b=(k,l,x)=>'<button class="'+(S[k]===x?'on':'')+'" onclick="set(\''+k+'\','+JSON.stringify(x).replace(/"/g,'&quot;')+')">'+l+'</button>';
 $('ui').innerHTML='<div class="r"><b>兵種</b>'+Object.keys(T).map(k=>b('t',KJ[k],k)).join('')+'</div><div class="r"><b>陣形</b>'+Object.keys(T[S.t].f).map(k=>b('f',T[S.t].f[k][0],k)).join('')+'</div><div class="r"><b>兵数</b>'+[3,2,1].map(h=>b('hp',h,h)).join('')+'</div><div class="r"><b>向き</b>'+['↑','→','↓','←'].map((l,i)=>b('d',l,i)).join('')+'</div><div class="r"><b>陣営</b>'+b('o','赤',0)+b('o','青',1)+'</div>'}
let th=.45,ph=1,ds=85;const pts=new Map();let pd=0;
function cm(){cam.position.set(ds*Math.sin(ph)*Math.sin(th),5+ds*Math.cos(ph),ds*Math.sin(ph)*Math.cos(th));cam.lookAt(0,5,0)}
v.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);v.setPointerCapture(e.pointerId);pd=0});
v.addEventListener('pointerup',e=>pts.delete(e.pointerId));v.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
v.addEventListener('pointermove',e=>{const o=pts.get(e.pointerId);if(!o)return;
 if(pts.size==1){th-=(e.clientX-o[0])*.01;ph=Math.max(.2,Math.min(1.45,ph-(e.clientY-o[1])*.01))}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)ds=Math.max(45,Math.min(160,ds*pd/d));pd=d}cm()});
v.addEventListener('wheel',e=>{ds=Math.max(45,Math.min(160,ds+e.deltaY*.05));cm()},{passive:true});
function rs(){const w=v.clientWidth,h=v.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();cm();draw();ui();
let ang=0;(function loop(){let d=-S.d*Math.PI/2-ang;d=Math.atan2(Math.sin(d),Math.cos(d));ang+=d*.2;F.rotation.y=ang;R.render(sc,cam);requestAnimationFrame(loop)})();
</script></body></html>
